name: anna311
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - imageio[ffmpeg]
  - ipympl
  - ipywidgets
  - jupyterlab
  - jupytext
  - numpy=2.2.6
  - numexpr
  - matplotlib
  - opencv
  - pandas
  - scipy
  - scikit-learn
  - seaborn
  - tifffile

  - pip:
    - rastermap
    - -e git+https://github.com/annajxli/pytoolsAL.git#egg=pytoolsAL
    - -e git+https://github.com/cortex-lab/phylib.git#egg=phylib
